<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notey Child — a little music reader</title>

    <!-- Verovio -->
    <script
        src="https://www.verovio.org/javascript/5.7.0/verovio-toolkit-wasm.js"
        defer>
    </script>

    <!-- MIDI player -->
    <script src="https://www.midijs.net/lib/midi.js"></script>

    <!-- Shared engine (Verovio + MIDI logic used by every activity) -->
    <script src="music-engine.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .appTitle {
            text-align: center;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 10px 0 0 0;
        }

        .appTitle span:nth-child(1) { color: #e6194b; }
        .appTitle span:nth-child(2) { color: #f58231; }
        .appTitle span:nth-child(3) { color: #ffcc00; }
        .appTitle span:nth-child(4) { color: #3cb44b; }
        .appTitle span:nth-child(5) { color: #17a2b8; }
        .appTitle span:nth-child(6) { color: #4363d8; }
        .appTitle span:nth-child(7) { color: #911eb4; }
        .appTitle span:nth-child(8) { color: #e83e8c; }
        .appTitle span:nth-child(9) { color: #fd7e14; }
        .appTitle span:nth-child(10) { color: #20c997; }

        .appSubtitle {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #555;
            margin-bottom: 20px;
        }

        button {
            font-size: 18px;
            padding: 8px 16px;
            margin-right: 8px;
        }

        /*
         * Make the main PLAY button stand out from the rest -
         * it's the button people reach for most.
         */
        #playButton {
            background: #2e9e44;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            padding: 12px 28px;
        }

        #playButton:hover {
            background: #257a37;
        }

        #melodySelector {
            font-size: 24px;
            padding: 10px 16px;
            min-width: 340px;
            border: 3px solid #4a90d9;
            border-radius: 8px;
        }

        label[for="melodySelector"] {
            font-size: 24px;
            font-weight: bold;
        }

        #score {
            max-width: 1000px;
            margin-top: 30px;
        }

        /* Normal notation */
        #score g.note {
            fill: black;
        }

        /* Note currently being played */
        #score g.note.playing {
            fill: red;
        }
    
        .activityNav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 15px 0 25px 0;
        }

        .activityNav a {
            display: inline-block;
            padding: 8px 16px;
            background: #f0f0f0;
            border: 2px solid #ccc;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-size: 16px;
            font-weight: bold;
        }

        .activityNav a:hover {
            background: #e0e0e0;
        }

        .activityNav a.current {
            background: #4a90d9;
            border-color: #4a90d9;
            color: white;
        }

    </style>
</head>

<body>

    <h1 class="appTitle"><span>N</span><span>O</span><span>T</span><span>E</span><span>Y</span> <span>C</span><span>H</span><span>I</span><span>L</span><span>D</span></h1>
    <div class="appSubtitle">LITTLE MUSIC READER</div>

    <nav class="activityNav">
        <a href="index.html" class="current">🎵 Listen &amp; Follow</a>
        <a href="index_puzzle.html">🧩 Puzzle</a>
        <a href="index_listen_choose.html">🎧 Listen &amp; Choose</a>
        <a href="index_find_in_score.html">🔍 Find It</a>
        <a href="index_rhythm_builder.html">🎼 Build a Melody</a>
        <a href="index_rhythm_choice.html">🥁 Choose a Rhythm</a>
    </nav>

    <label for="melodySelector">Melody:</label>
    <select id="melodySelector"></select>

    <br><br>

    <button id="playButton">PLAY</button>
    <button id="stopButton">■ Stop</button>

    <div id="score">Loading music...</div>

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            function loadMelody(toolkit, entry) {

                document.getElementById("score").innerHTML =
                    "Loading music...";

                return MusicEngine.loadMusicXML(entry.file)
                    .then(function (musicXML) {

                        window.originalMusicXML = musicXML;

                        MusicEngine.renderScore(toolkit, musicXML, "score");

                        MusicEngine.attachHighlighting(toolkit);

                    })
                    .catch(function (error) {

                        console.error(error);

                        document.getElementById("score").innerHTML =
                            "<p>Could not load the music.</p>";

                    });

            }


            MusicEngine.ready(function (toolkit) {

                MusicEngine.loadCatalog("melodies.json")
                    .then(function (melodies) {

                        const selector =
                            document.getElementById("melodySelector");

                        melodies.forEach(function (entry, index) {

                            const option =
                                document.createElement("option");

                            option.value = index;

                            option.textContent =
                                entry.title +
                                (entry.composer ? " – " + entry.composer : "");

                            selector.appendChild(option);

                        });

                        selector.addEventListener("change", function () {

                            loadMelody(
                                toolkit,
                                melodies[Number(selector.value)]
                            );

                        });

                        if (melodies.length > 0) {
                            loadMelody(toolkit, melodies[0]);
                        }

                    })
                    .catch(function (error) {

                        console.error(error);

                        document.getElementById("score").innerHTML =
                            "<p>Could not load the melody catalog.</p>";

                    });


                document.getElementById("playButton")
                    .addEventListener("click", function () {
                        MusicEngine.playMIDI(toolkit);
                    });


                document.getElementById("stopButton")
                    .addEventListener("click", function () {
                        MusicEngine.stopMIDI();
                    });

            });

        });

    </script>

</body>

</html>
