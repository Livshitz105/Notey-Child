<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notey Child — a little music reader – Choose a Chord</title>

    <!-- Verovio -->
    <script
        src="https://www.verovio.org/javascript/5.7.0/verovio-toolkit-wasm.js"
        defer>
    </script>

    <!-- MIDI player -->
    <script src="https://www.midijs.net/lib/midi.js"></script>

    <!-- Shared engine (Verovio + MIDI logic used by every activity) -->
    <script src="music-engine.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .appTitle {
            text-align: center;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 10px 0 0 0;
        }

        .appTitle span:nth-child(1) { color: #e6194b; }
        .appTitle span:nth-child(2) { color: #f58231; }
        .appTitle span:nth-child(3) { color: #ffcc00; }
        .appTitle span:nth-child(4) { color: #3cb44b; }
        .appTitle span:nth-child(5) { color: #17a2b8; }
        .appTitle span:nth-child(6) { color: #4363d8; }
        .appTitle span:nth-child(7) { color: #911eb4; }
        .appTitle span:nth-child(8) { color: #e83e8c; }
        .appTitle span:nth-child(9) { color: #fd7e14; }
        .appTitle span:nth-child(10) { color: #20c997; }

        .appSubtitle {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #555;
            margin-bottom: 20px;
        }

        button {
            font-size: 18px;
            padding: 8px 16px;
            margin-right: 8px;
            margin-bottom: 10px;
        }

        /*
         * Make the main PLAY button stand out from the rest -
         * it's the button people reach for most.
         */
        #playButton {
            background: #2e9e44;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            padding: 12px 28px;
        }

        #playButton:hover {
            background: #257a37;
        }

        #taskSelector {
            font-size: 18px;
            padding: 6px 10px;
            min-width: 320px;
        }

        #instructions {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }

        #variants {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .variantTile {
            position: relative;

            width: 480px;
            height: 300px;

            border: 4px solid #888;
            border-radius: 12px;

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-sizing: border-box;

            overflow: hidden;
        }

        .variantTile > svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .variantTile.correctTile {
            border-color: #2e9e44;
        }

        .variantTile.wrongTile {
            border-color: #d0392b;
        }

        .variantTile.disabledTile {
            cursor: default;
            opacity: 0.85;
        }

        /* Colored note highlighting during playback */
        .variantTile g.note {
            fill: black;
        }

        .variantTile g.note.playing {
            fill: red;
        }

        .playPieceButton {
            position: absolute;
            bottom: 10px;
            right: 10px;

            width: 42px;
            height: 42px;

            border-radius: 50%;
            border: none;

            background: #4a90d9;
            color: white;

            font-size: 18px;
            line-height: 42px;
            padding: 0;
            margin: 0;

            cursor: pointer;
        }

        .playPieceButton:hover {
            background: #3a7bc0;
        }

        #choiceMessage {
            font-size: 32px;
            margin-top: 30px;
            min-height: 50px;
        }

        #chordReveal {
            margin-top: 10px;
        }

        #chordReveal .revealLabel {
            font-size: 18px;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        #chordReveal .exploreTile {
            position: relative;

            width: 480px;
            height: 300px;

            border: 4px solid #2e9e44;
            border-radius: 12px;

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            box-sizing: border-box;

            overflow: hidden;
        }

        #chordReveal .exploreTile > svg {
            width: 100%;
            height: 100%;
            display: block;
        }

    
        .activityNav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 15px 0 25px 0;
        }

        .activityNav a {
            display: inline-block;
            padding: 8px 16px;
            background: #f0f0f0;
            border: 2px solid #ccc;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-size: 16px;
            font-weight: bold;
        }

        .activityNav a:hover {
            background: #e0e0e0;
        }

        .activityNav a.current {
            background: #4a90d9;
            border-color: #4a90d9;
            color: white;
        }

    </style>

</head>


<body>

    <h1 class="appTitle"><span>N</span><span>O</span><span>T</span><span>E</span><span>Y</span> <span>C</span><span>H</span><span>I</span><span>L</span><span>D</span></h1>
    <div class="appSubtitle">LITTLE MUSIC READER</div>

    <nav class="activityNav">
        <a href="index.html">🎵 Listen &amp; Follow</a>
        <a href="index_puzzle.html">🧩 Puzzle</a>
        <a href="index_listen_choose.html">🎧 Listen &amp; Choose</a>
        <a href="index_find_in_score.html">🔍 Find It</a>
        <a href="index_rhythm_builder.html">🎼 Build a Melody</a>
        <a href="index_rhythm_choice.html">🥁 Choose a Rhythm</a>
        <a href="index_chord_explore.html">🔎 Chord Explorer</a>
        <a href="index_chord_choose.html" class="current">🎹 Choose a Chord</a>
        <a href="index_chord_builder.html">🏗️ Chord Builder</a>
    </nav>

    <label for="taskSelector">Chord:</label>
    <select id="taskSelector"></select>

    <br><br>

    <p id="instructions">Click "PLAY" to hear a chord, then choose the notes that make it up.</p>

    <button id="playButton">▶ PLAY</button>
    <button id="stopButton">■ Stop</button>

    <div id="variants">Loading exercise...</div>

    <div id="choiceMessage"></div>

    <div id="chordReveal"></div>


    <script>

        document.addEventListener("DOMContentLoaded", function () {

            let currentTask = null;

            /*
             * How long to show "Yes! That's the one." before
             * automatically resetting for another go, without
             * needing a page refresh.
             */
            const AUTO_RESET_DELAY_MS = 3500;


            /*
             * Returns a shuffled COPY of an array - the original
             * is left untouched, so re-loading the same exercise
             * later reshuffles fresh rather than compounding a
             * previous shuffle.
             */
            function shuffledCopy(array) {

                const copy = array.slice();

                for (let i = copy.length - 1; i > 0; i--) {

                    const j = Math.floor(Math.random() * (i + 1));

                    const temp = copy[i];
                    copy[i] = copy[j];
                    copy[j] = temp;

                }

                return copy;

            }


            /*
             * =================================================
             * LOAD ONE EXERCISE
             * =================================================
             */

            function loadTask(task) {

                currentTask = task;
                currentTask.promptXML = null;

                document.getElementById("choiceMessage").textContent = "";
                document.getElementById("chordReveal").innerHTML = "";

                const container = document.getElementById("variants");

                container.innerHTML = "Loading exercise...";

                /*
                 * The prompt (what PLAY actually plays) is now a
                 * dedicated file, entirely separate from the answer
                 * options - unlike the old design, the thing played
                 * is never one of the clickable choices itself.
                 */
                const promptPromise =
                    MusicEngine.loadMusicXML(task.promptFile);

                /*
                 * Shuffle the display order every time - otherwise
                 * the correct answer would always be whichever
                 * position it happens to sit at in the JSON file
                 * (usually first, since that's the natural way to
                 * author it).
                 */
                const shuffledVariants = shuffledCopy(task.variants);

                const variantPromises =
                    shuffledVariants.map(function (variant) {
                        return MusicEngine.loadMusicXML(variant.file);
                    });

                Promise.all([promptPromise, Promise.all(variantPromises)])
                    .then(function (results) {

                        const promptXML = results[0];
                        const xmlList = results[1];

                        currentTask.promptXML = promptXML;

                        /*
                         * "g.system" instead of "g.measure" -
                         * a variant may be more than one measure
                         * long, so we crop around the whole line
                         * of music, not just its first measure.
                         *
                         * The "...WithToolkits" version keeps each
                         * tile's own Verovio toolkit instance alive
                         * (instead of discarding it after
                         * rendering), so that later, when that
                         * specific tile's preview is played, we can
                         * highlight the exact notes sounding in
                         * THAT tile - a fresh toolkit loaded with
                         * the same XML is not guaranteed to produce
                         * matching note IDs, so re-using the same
                         * instance that did the rendering is what
                         * keeps playback and highlighting in sync.
                         */
                        const rendered =
                            MusicEngine.renderMiniMeasureSetWithToolkits(
                                xmlList, "g.system"
                            );

                        container.innerHTML = "";

                        shuffledVariants.forEach(function (variant, index) {

                            const tile =
                                document.createElement("div");

                            tile.className = "variantTile";

                            if (rendered[index].svg) {
                                tile.innerHTML = rendered[index].svg;
                            }
                            else {
                                tile.textContent =
                                    variant.label ||
                                    ("Option " + (index + 1));
                            }

                            tile.addEventListener("click", function () {
                                choiceClicked(tile, variant, task);
                            });

                            /*
                             * Let a child listen to what THIS
                             * option actually sounds like, with its
                             * notes coloring red in sync as they
                             * sound - and compare it to what PLAY
                             * (the target) played. stopPropagation
                             * keeps this from also triggering the
                             * tile's own click (which registers a
                             * choice/guess).
                             */
                            const optionToolkit = rendered[index].toolkit;

                            if (optionToolkit) {

                                const playButton =
                                    document.createElement("button");

                                playButton.className = "playPieceButton";
                                playButton.type = "button";
                                playButton.title = "Play this option";
                                playButton.textContent = "▶";

                                playButton.addEventListener(
                                    "click",
                                    function (event) {

                                        event.stopPropagation();

                                        MusicEngine.attachHighlighting(
                                            optionToolkit
                                        );

                                        MusicEngine.playMIDI(
                                            optionToolkit
                                        );

                                    }
                                );

                                tile.appendChild(playButton);

                            }

                            container.appendChild(tile);

                        });

                    })
                    .catch(function (error) {

                        console.error(error);

                        container.innerHTML =
                            "<p>Could not load this exercise.</p>";

                    });

            }


            /*
             * Renders the solid chord (what PLAY actually played)
             * once the exercise has been solved correctly - up to
             * that point it was only ever audible, never shown.
             */
            function revealChord(promptXML) {

                const container = document.getElementById("chordReveal");

                if (!promptXML) {
                    container.innerHTML = "";
                    return;
                }

                const rendered =
                    MusicEngine.renderMiniMeasureSetWithToolkits(
                        [promptXML], "g.system"
                    );

                container.innerHTML =
                    '<div class="revealLabel">The chord was:</div>';

                const tile = document.createElement("div");
                tile.className = "exploreTile";
                tile.innerHTML = rendered[0].svg || "";

                container.appendChild(tile);

            }


            /*
             * =================================================
             * HANDLE A CHOICE
             * =================================================
             */

            function choiceClicked(tile, variant, task) {

                if (tile.classList.contains("disabledTile")) {
                    return;
                }

                if (variant.correct) {

                    tile.classList.add("correctTile", "disabledTile");

                    /*
                     * Lock the whole exercise once it's solved.
                     */
                    document
                        .querySelectorAll(".variantTile")
                        .forEach(function (t) {
                            t.classList.add("disabledTile");
                        });

                    document.getElementById("choiceMessage").textContent =
                        "Yes! That's the one.";

                    /*
                     * Now that it's solved, show the actual chord
                     * that was played - up to now it was only ever
                     * heard, never seen.
                     */
                    revealChord(task.promptXML);

                    /*
                     * Automatically reset back to a fresh,
                     * reshuffled round of the SAME exercise after
                     * a short pause, so the next attempt doesn't
                     * need a page refresh. The currentTask check
                     * guards against a rare race: if the person
                     * switches to a different exercise via the
                     * dropdown during this pause, don't clobber
                     * whatever they've since switched to.
                     */
                    setTimeout(function () {

                        if (currentTask === task) {
                            loadTask(task);
                        }

                    }, AUTO_RESET_DELAY_MS);

                }
                else {

                    tile.classList.add("wrongTile", "disabledTile");

                    document.getElementById("choiceMessage").textContent =
                        "Not quite - listen again and try another.";

                }

            }


            /*
             * =================================================
             * PLAY / STOP
             * =================================================
             */

            document.getElementById("playButton")
                .addEventListener("click", function () {

                    if (currentTask && currentTask.promptXML) {
                        MusicEngine.playMusicXML(currentTask.promptXML);
                    }

                });

            document.getElementById("stopButton")
                .addEventListener("click", function () {
                    MusicEngine.stopMIDI();
                });


            /*
             * =================================================
             * LOAD THE EXERCISE CATALOG
             * =================================================
             */

            MusicEngine.ready(function () {

                MusicEngine.loadCatalog("chord-listening-tasks.json")
                    .then(function (tasks) {

                        const selector =
                            document.getElementById("taskSelector");

                        tasks.forEach(function (task, index) {

                            const option =
                                document.createElement("option");

                            option.value = index;
                            option.textContent = task.title;

                            selector.appendChild(option);

                        });

                        selector.addEventListener("change", function () {
                            loadTask(tasks[Number(selector.value)]);
                        });

                        if (tasks.length > 0) {
                            loadTask(tasks[0]);
                        }

                    })
                    .catch(function (error) {

                        console.error(error);

                        document.getElementById("variants").innerHTML =
                            "<p>Could not load the exercise catalog.</p>";

                    });

            });

        });

    </script>

</body>

</html>
