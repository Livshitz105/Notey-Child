<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Little Music Reader – Puzzle</title>

    <!-- Verovio -->
    <script
        src="https://www.verovio.org/javascript/5.7.0/verovio-toolkit-wasm.js"
        defer>
    </script>

    <!-- MIDI player -->
    <script src="https://www.midijs.net/lib/midi.js"></script>

    <!-- Shared engine (Verovio + MIDI logic used by every activity) -->
    <script src="music-engine.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        button {
            font-size: 18px;
            padding: 8px 16px;
            margin-right: 8px;
            margin-bottom: 10px;
        }

        #melodySelector {
            font-size: 18px;
            padding: 6px 10px;
            min-width: 320px;
        }

        #score {
            max-width: 1000px;
            margin-top: 30px;
        }

        #puzzleArea {
            display: none;
            margin-top: 30px;
        }

        #pieces {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .measurePiece {
            position: relative;

            width: 360px;
            height: 220px;

            border: 4px solid #888;
            border-radius: 12px;

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: grab;

            box-sizing: border-box;

            overflow: hidden;

            /*
             * Stop the browser's own touch scrolling/panning from
             * fighting with our own drag handling on touchscreens.
             */
            touch-action: none;

            /*
             * Don't let dragging select the text/notation as if
             * it were a text selection.
             */
            user-select: none;
        }

        .measurePiece.dragging {
            cursor: grabbing;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
            opacity: 0.9;
        }

        .measurePiece > svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .playPieceButton {
            position: absolute;
            bottom: 8px;
            right: 8px;

            width: 36px;
            height: 36px;

            border-radius: 50%;
            border: none;

            background: #4a90d9;
            color: white;

            font-size: 16px;
            line-height: 36px;
            padding: 0;
            margin: 0;

            cursor: pointer;
        }

        .playPieceButton:hover {
            background: #3a7bc0;
        }

        #puzzleMessage {
            font-size: 40px;
            margin-top: 40px;
            min-height: 60px;
        }

        /* Normal score */
        #score g.note {
            fill: black;
        }

        #score g.note.playing {
            fill: red;
        }

    </style>

</head>


<body>

    <h1>Little Music Reader</h1>

    <label for="melodySelector">Melody:</label>
    <select id="melodySelector"></select>

    <br><br>

    <button id="playButton">PLAY</button>
    <button id="stopButton">■ Stop</button>
    <button id="puzzleButton">PUZZLE</button>


    <div id="score">
        Loading music...
    </div>


    <div id="puzzleArea">

        <h2>Put the music in the right order</h2>

        <p>
            Drag a piece to move it to a new position.
        </p>

        <div id="pieces"></div>

        <br>

        <button id="checkButton">CHECK</button>
        <button id="playPuzzleButton">PLAY PUZZLE</button>
        <button id="backButton">BACK TO MUSIC</button>

        <div id="puzzleMessage"></div>

    </div>


    <script>

        document.addEventListener("DOMContentLoaded", function () {

            window.originalMusicXML = null;


            /*
             * =================================================
             * LOAD A MELODY (used both on startup and whenever
             * the dropdown selection changes)
             * =================================================
             */

            function loadMelody(toolkit, entry) {

                document.getElementById("score").innerHTML =
                    "Loading music...";

                return MusicEngine.loadMusicXML(entry.file)
                    .then(function (musicXML) {

                        window.originalMusicXML = musicXML;

                        MusicEngine.renderScore(toolkit, musicXML, "score");

                        console.log("Loaded:", entry.title);

                        /*
                         * If the puzzle is open when the melody
                         * changes, rebuild it for the new piece
                         * instead of leaving the old one showing.
                         */
                        document.getElementById("puzzleMessage")
                            .textContent = "";

                        const puzzleIsOpen =
                            document.getElementById("puzzleArea")
                                .style.display === "block";

                        if (puzzleIsOpen) {
                            createPuzzle();
                        }

                    })
                    .catch(function (error) {

                        console.error(error);

                        document.getElementById("score").innerHTML =
                            "<p>Could not load the music.</p>";

                    });

            }


            /*
             * =================================================
             * LOAD THE MELODY CATALOG AND POPULATE THE DROPDOWN
             * =================================================
             */

            MusicEngine.ready(function (toolkit) {

                /*
                 * Highlight notes red as they play. This only
                 * needs to be set up once - it always reflects
                 * whatever piece is currently loaded into this
                 * same toolkit, so it keeps working correctly
                 * even after switching melodies.
                 */
                MusicEngine.attachHighlighting(toolkit);


                MusicEngine.loadCatalog("melodies.json")
                    .then(function (melodies) {

                        const selector =
                            document.getElementById("melodySelector");

                        melodies.forEach(function (entry, index) {

                            const option =
                                document.createElement("option");

                            option.value = index;

                            option.textContent =
                                entry.title +
                                (entry.composer ? " – " + entry.composer : "");

                            selector.appendChild(option);

                        });

                        selector.addEventListener("change", function () {

                            loadMelody(
                                toolkit,
                                melodies[Number(selector.value)]
                            );

                        });

                        /*
                         * Load the first melody in the catalog
                         * automatically on startup.
                         */
                        if (melodies.length > 0) {
                            loadMelody(toolkit, melodies[0]);
                        }

                    })
                    .catch(function (error) {

                        console.error(error);

                        document.getElementById("score").innerHTML =
                            "<p>Could not load the melody catalog.</p>";

                    });


                /*
                 * PLAY
                 */
                document.getElementById("playButton")
                    .addEventListener("click", function () {
                        MusicEngine.playMIDI(toolkit);
                    });


                /*
                 * STOP
                 */
                document.getElementById("stopButton")
                    .addEventListener("click", function () {
                        MusicEngine.stopMIDI();
                    });


                /*
                 * PLAY PUZZLE
                 *
                 * Play the music in the current puzzle order.
                 */
                document.getElementById("playPuzzleButton")
                    .addEventListener("click", function () {

                        const pieces =
                            Array.from(
                                document.querySelectorAll(".measurePiece")
                            );

                        const currentOrder =
                            pieces.map(function (piece) {
                                return Number(piece.dataset.measure);
                            });

                        console.log("Playing puzzle order:", currentOrder);

                        const reorderedXML =
                            MusicEngine.makeReorderedMusicXML(
                                window.originalMusicXML,
                                currentOrder
                            );

                        MusicEngine.playMusicXML(reorderedXML);

                    });

            });


            /*
             * =================================================
             * PUZZLE BUTTON
             * =================================================
             */

            document.getElementById("puzzleButton")
                .addEventListener("click", function () {

                    document.getElementById("score").style.display = "none";
                    document.getElementById("puzzleArea").style.display = "block";
                    document.getElementById("puzzleMessage").textContent = "";

                    createPuzzle();

                });


            /*
             * =================================================
             * SCRAMBLE HELPER
             * =================================================
             *
             * Returns [1, 2, ..., count] shuffled into a random
             * order that is NOT already the correct order (that
             * would make for a pretty boring puzzle).
             */

            function shuffledMeasureOrder(count) {

                const order = [];

                for (let i = 1; i <= count; i++) {
                    order.push(i);
                }

                const solved = order.join(",");

                let attempts = 0;

                do {

                    for (let i = order.length - 1; i > 0; i--) {

                        const j = Math.floor(Math.random() * (i + 1));

                        const temp = order[i];
                        order[i] = order[j];
                        order[j] = temp;

                    }

                    attempts++;

                } while (order.join(",") === solved && attempts < 20);

                return order;

            }


            /*
             * =================================================
             * CREATE PUZZLE
             * =================================================
             */

            function createPuzzle() {

                const container = document.getElementById("pieces");

                container.innerHTML = "";

                if (!window.originalMusicXML) {

                    document.getElementById("puzzleMessage").textContent =
                        "The music is still loading.";

                    return;

                }

                const measureCount =
                    MusicEngine.countMeasures(window.originalMusicXML);

                if (measureCount < 2) {

                    document.getElementById("puzzleMessage").textContent =
                        "This melody is too short for a puzzle.";

                    return;

                }

                const order = shuffledMeasureOrder(measureCount);

                /*
                 * Build every piece's mini-XML first...
                 */
                const miniXMLList = order.map(function (measureNumber) {

                    try {
                        return MusicEngine.makeMiniMusicXML(
                            window.originalMusicXML,
                            measureNumber
                        );
                    }
                    catch (error) {
                        console.error(
                            "Error preparing measure", measureNumber, error
                        );
                        return null;
                    }

                });

                /*
                 * ...then render them all together, at one shared
                 * scale, so every piece shows notation at the same
                 * physical size regardless of how sparse or dense
                 * its content is.
                 */
                const miniSVGList =
                    MusicEngine.renderMiniMeasureSet(miniXMLList);

                order.forEach(function (measureNumber, index) {

                    const piece = document.createElement("div");

                    piece.className = "measurePiece";
                    piece.dataset.measure = measureNumber;

                    if (miniSVGList[index]) {
                        piece.innerHTML = miniSVGList[index];
                    }
                    else {
                        piece.textContent = "Measure " + measureNumber;
                    }

                    makeDraggable(piece);

                    /*
                     * A small play button on each piece, so a
                     * child can hear how that one piece sounds
                     * before deciding where it goes. stopPropagation
                     * keeps this click from also triggering the
                     * tile's own click handler (which selects the
                     * piece for swapping).
                     */
                    if (miniXMLList[index]) {

                        const playButton =
                            document.createElement("button");

                        playButton.className = "playPieceButton";
                        playButton.type = "button";
                        playButton.title = "Play this piece";
                        playButton.textContent = "▶";

                        playButton.addEventListener("click", function (event) {

                            event.stopPropagation();

                            MusicEngine.playMusicXML(miniXMLList[index]);

                        });

                        piece.appendChild(playButton);

                    }

                    container.appendChild(piece);

                });

            }


            /*
             * =================================================
             * DRAG AND DROP (using Pointer Events, not the native
             * HTML5 drag-and-drop API - native drag-and-drop is
             * unreliable on touchscreens/tablets, while Pointer
             * Events work consistently for mouse, touch, and pen)
             * =================================================
             */

            let dragState = null;

            function makeDraggable(piece) {

                piece.addEventListener("pointerdown", function (event) {

                    /*
                     * Don't start a drag when the little play
                     * button was pressed - let its own click
                     * handler take over instead.
                     */
                    if (event.target.closest(".playPieceButton")) {
                        return;
                    }

                    event.preventDefault();

                    const rect = piece.getBoundingClientRect();

                    dragState = {
                        piece: piece,
                        grabOffsetX: event.clientX - rect.left,
                        grabOffsetY: event.clientY - rect.top
                    };

                    piece.setPointerCapture(event.pointerId);

                    piece.classList.add("dragging");

                });

                piece.addEventListener("pointermove", function (event) {

                    if (!dragState || dragState.piece !== piece) {
                        return;
                    }

                    /*
                     * Temporarily ignore this piece for hit-testing,
                     * so we can see whichever OTHER piece is under
                     * the pointer right now.
                     */
                    piece.style.pointerEvents = "none";

                    const hoverTarget =
                        document.elementFromPoint(
                            event.clientX, event.clientY
                        );

                    piece.style.pointerEvents = "";

                    const targetPiece =
                        hoverTarget
                            ? hoverTarget.closest(".measurePiece")
                            : null;

                    /*
                     * Live-reorder: as the dragged piece passes the
                     * midpoint of another piece, slot it in before
                     * or after that piece.
                     */
                    if (targetPiece && targetPiece !== piece) {

                        const container =
                            document.getElementById("pieces");

                        const targetRect =
                            targetPiece.getBoundingClientRect();

                        const midpoint =
                            targetRect.left + targetRect.width / 2;

                        if (event.clientX < midpoint) {
                            container.insertBefore(piece, targetPiece);
                        }
                        else {
                            container.insertBefore(
                                piece, targetPiece.nextSibling
                            );
                        }

                    }

                    /*
                     * Recompute the piece's natural (in-flow)
                     * position AFTER any reordering above, then
                     * offset it so it stays attached to the same
                     * point on the cursor, with no visual jump.
                     */
                    piece.style.transform = "none";

                    const naturalRect = piece.getBoundingClientRect();

                    const dx =
                        event.clientX - dragState.grabOffsetX -
                        naturalRect.left;

                    const dy =
                        event.clientY - dragState.grabOffsetY -
                        naturalRect.top;

                    piece.style.transform =
                        "translate(" + dx + "px, " + dy + "px)";

                });

                function endDrag(event) {

                    if (!dragState || dragState.piece !== piece) {
                        return;
                    }

                    piece.releasePointerCapture(event.pointerId);

                    piece.classList.remove("dragging");
                    piece.style.transform = "";

                    dragState = null;

                    document.getElementById("puzzleMessage").textContent =
                        "";

                }

                piece.addEventListener("pointerup", endDrag);
                piece.addEventListener("pointercancel", endDrag);

            }


            /*
             * =================================================
             * CHECK
             * =================================================
             */

            document.getElementById("checkButton")
                .addEventListener("click", function () {

                    const pieces =
                        Array.from(
                            document.getElementById("pieces").children
                        );

                    const numbers =
                        pieces.map(function (piece) {
                            return Number(piece.dataset.measure);
                        });

                    const correctOrder = [];

                    for (let i = 1; i <= numbers.length; i++) {
                        correctOrder.push(i);
                    }

                    const correct =
                        numbers.join(",") === correctOrder.join(",");

                    document.getElementById("puzzleMessage").textContent =
                        correct
                            ? "Yes! That is the melody!"
                            : "Wanna try one more time?";

                });


            /*
             * =================================================
             * BACK TO MUSIC
             * =================================================
             */

            document.getElementById("backButton")
                .addEventListener("click", function () {

                    document.getElementById("puzzleArea").style.display = "none";
                    document.getElementById("score").style.display = "block";

                });

        });

    </script>

</body>

</html>
