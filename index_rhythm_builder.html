<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notey Child — a little music reader – Build a Melody</title>

    <!-- Verovio -->
    <script
        src="https://www.verovio.org/javascript/5.7.0/verovio-toolkit-wasm.js"
        defer>
    </script>

    <!-- MIDI player -->
    <script src="https://www.midijs.net/lib/midi.js"></script>

    <!-- Shared engine (Verovio + MIDI logic used by every activity) -->
    <script src="music-engine.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .appTitle {
            text-align: center;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 10px 0 0 0;
        }

        .appTitle span:nth-child(1) { color: #e6194b; }
        .appTitle span:nth-child(2) { color: #f58231; }
        .appTitle span:nth-child(3) { color: #ffcc00; }
        .appTitle span:nth-child(4) { color: #3cb44b; }
        .appTitle span:nth-child(5) { color: #17a2b8; }
        .appTitle span:nth-child(6) { color: #4363d8; }
        .appTitle span:nth-child(7) { color: #911eb4; }
        .appTitle span:nth-child(8) { color: #e83e8c; }
        .appTitle span:nth-child(9) { color: #fd7e14; }
        .appTitle span:nth-child(10) { color: #20c997; }

        .appSubtitle {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #555;
            margin-bottom: 20px;
        }

        button {
            font-size: 18px;
            padding: 8px 16px;
            margin-right: 8px;
            margin-bottom: 10px;
        }

        /*
         * Make the main PLAY button stand out from the rest -
         * it's the button people reach for most.
         */
        #playButton {
            background: #2e9e44;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            padding: 12px 28px;
        }

        #playButton:hover {
            background: #257a37;
        }

        #setSelector {
            font-size: 24px;
            padding: 10px 16px;
            min-width: 340px;
            border: 3px solid #4a90d9;
            border-radius: 8px;
        }

        label[for="setSelector"] {
            font-size: 24px;
            font-weight: bold;
        }

        #instructions {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }

        h2 {
            margin-top: 35px;
        }

        .slot {
            margin-top: 15px;
        }

        .slotOptions {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 10px;
        }

        .rhythmOption {
            position: relative;

            width: 300px;
            height: 190px;

            border: 4px solid #888;
            border-radius: 12px;

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-sizing: border-box;

            overflow: hidden;
        }

        .rhythmOption:hover {
            border-color: #4a90d9;
        }

        .rhythmOption.selected {
            border-color: #2e9e44;
            border-width: 6px;
        }

        .rhythmOption > svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .playPieceButton {
            position: absolute;
            bottom: 8px;
            right: 8px;

            width: 34px;
            height: 34px;

            border-radius: 50%;
            border: none;

            background: #4a90d9;
            color: white;

            font-size: 15px;
            line-height: 34px;
            padding: 0;
            margin: 0;

            cursor: pointer;
        }

        .playPieceButton:hover {
            background: #3a7bc0;
        }

        /*
         * A sticky panel showing the assembled melody, pinned to
         * the top of the screen as you scroll through phrase
         * choices below. Otherwise the result ends up far down
         * the page once a set has several phrases, and nothing
         * tells a first-time visitor they need to scroll to see
         * it at all.
         */
        #myMelodyPanel {
            position: sticky;
            top: 0;
            z-index: 100;

            background: white;
            border-bottom: 3px solid #4a90d9;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);

            padding: 10px 0 15px 0;
            margin-bottom: 20px;
        }

        #myMelodyPanel h2 {
            margin-top: 10px;
            margin-bottom: 5px;
        }

        #myMelody {
            max-width: 1000px;
            max-height: 180px;
            overflow: hidden;
            margin-top: 10px;
        }

        /*
         * Scale the rendered notation to fit its container instead
         * of showing at Verovio's own default width, which can be
         * wider than the screen.
         */
        #myMelody svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Colored note highlighting during playback */
        #myMelody g.note {
            fill: black;
        }

        #myMelody g.note.playing {
            fill: red;
        }

    
        .activityNav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 15px 0 25px 0;
        }

        .activityNav a {
            display: inline-block;
            padding: 8px 16px;
            background: #f0f0f0;
            border: 2px solid #ccc;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-size: 16px;
            font-weight: bold;
        }

        .activityNav a:hover {
            background: #e0e0e0;
        }

        .activityNav a.current {
            background: #4a90d9;
            border-color: #4a90d9;
            color: white;
        }

    </style>

</head>


<body>

    <h1 class="appTitle"><span>N</span><span>O</span><span>T</span><span>E</span><span>Y</span> <span>C</span><span>H</span><span>I</span><span>L</span><span>D</span></h1>
    <div class="appSubtitle">LITTLE MUSIC READER</div>

    <nav class="activityNav">
        <a href="index.html">🎵 Listen &amp; Follow</a>
        <a href="index_puzzle.html">🧩 Puzzle</a>
        <a href="index_listen_choose.html">🎧 Listen &amp; Choose</a>
        <a href="index_find_in_score.html">🔍 Find It</a>
        <a href="index_rhythm_builder.html" class="current">🎼 Build a Melody</a>
        <a href="index_rhythm_choice.html">🥁 Choose a Rhythm</a>
        <a href="index_chord_explore.html">🔎 Chord Explorer</a>
        <a href="index_chord_choose.html">🎹 Choose a Chord</a>
        <a href="index_chord_builder.html">🏗️ Chord Builder</a>
    </nav>

    <label for="setSelector">Melody Set:</label>
    <select id="setSelector"></select>

    <br><br>

    <p id="instructions">
        Choose a rhythm for each phrase, then press PLAY!
    </p>

    <div id="myMelodyPanel">
        <h2>Your Melody</h2>

        <button id="playButton">▶ PLAY MY MELODY</button>
        <button id="stopButton">■ Stop</button>

        <div id="myMelody"></div>
    </div>

    <div id="slots">Loading...</div>


    <script>

        document.addEventListener("DOMContentLoaded", function () {

            let currentSet = null;

            /*
             * Per slot: the full list of option entries, each
             * with its own loaded XML and rendered SVG.
             */
            let slotData = [];

            /*
             * Which option index is currently chosen in each slot.
             * Defaults to the first option, so there's always a
             * complete, playable melody from the moment a set loads.
             */
            let selections = [];

            let mainToolkit = null;


            /*
             * =================================================
             * LOAD A MELODY-BUILDER SET
             * =================================================
             */

            function loadSet(set) {

                currentSet = set;

                const slotsContainer = document.getElementById("slots");

                slotsContainer.innerHTML = "Loading...";

                /*
                 * Load every option of every slot, all at once.
                 */
                const allOptions = [];

                set.slots.forEach(function (slot) {
                    slot.options.forEach(function (option) {
                        allOptions.push(option);
                    });
                });

                const filePromises =
                    allOptions.map(function (option) {
                        return MusicEngine.loadMusicXML(option.file);
                    });

                Promise.all(filePromises)
                    .then(function (xmlList) {

                        /*
                         * All options across every slot share one
                         * scale, so rhythms render at a consistent,
                         * comparable size throughout.
                         */
                        const svgList =
                            MusicEngine.renderMiniMeasureSet(
                                xmlList, "g.measure"
                            );

                        slotData = [];
                        selections = [];

                        let cursor = 0;

                        set.slots.forEach(function (slot) {

                            const options =
                                slot.options.map(function (option) {

                                    const xml = xmlList[cursor];
                                    const svg = svgList[cursor];

                                    cursor = cursor + 1;

                                    return {
                                        label: option.label,
                                        xml: xml,
                                        svg: svg
                                    };

                                });

                            slotData.push(options);
                            selections.push(0);

                        });

                        renderSlots();
                        recomputeMelody();

                    })
                    .catch(function (error) {

                        console.error(error);

                        slotsContainer.innerHTML =
                            "<p>Could not load this melody set.</p>";

                    });

            }


            /*
             * =================================================
             * RENDER THE SLOTS AND THEIR OPTIONS
             * =================================================
             */

            function renderSlots() {

                const slotsContainer = document.getElementById("slots");

                slotsContainer.innerHTML = "";

                currentSet.slots.forEach(function (slot, slotIndex) {

                    const slotDiv = document.createElement("div");

                    slotDiv.className = "slot";

                    const heading = document.createElement("h2");

                    heading.textContent = slot.label;

                    slotDiv.appendChild(heading);

                    const optionsDiv = document.createElement("div");

                    optionsDiv.className = "slotOptions";

                    slotData[slotIndex].forEach(function (option, optionIndex) {

                        const tile = document.createElement("div");

                        tile.className = "rhythmOption";

                        if (optionIndex === selections[slotIndex]) {
                            tile.classList.add("selected");
                        }

                        if (option.svg) {
                            tile.innerHTML = option.svg;
                        }
                        else {
                            tile.textContent =
                                option.label || ("Option " + (optionIndex + 1));
                        }

                        tile.addEventListener("click", function () {
                            chooseOption(slotIndex, optionIndex);
                        });

                        const playButton =
                            document.createElement("button");

                        playButton.className = "playPieceButton";
                        playButton.type = "button";
                        playButton.title = "Play this rhythm";
                        playButton.textContent = "▶";

                        playButton.addEventListener("click", function (event) {
                            event.stopPropagation();
                            MusicEngine.playMusicXML(option.xml);
                        });

                        tile.appendChild(playButton);

                        optionsDiv.appendChild(tile);

                    });

                    slotDiv.appendChild(optionsDiv);

                    slotsContainer.appendChild(slotDiv);

                });

            }


            /*
             * =================================================
             * CHOOSE AN OPTION FOR A SLOT
             * =================================================
             */

            function chooseOption(slotIndex, optionIndex) {

                selections[slotIndex] = optionIndex;

                /*
                 * Update the "selected" highlight within just this
                 * slot, without rebuilding every tile.
                 */
                const slotDivs =
                    document.querySelectorAll("#slots .slot");

                const tiles =
                    slotDivs[slotIndex].querySelectorAll(".rhythmOption");

                tiles.forEach(function (tile, index) {
                    tile.classList.toggle(
                        "selected", index === optionIndex
                    );
                });

                recomputeMelody();

            }


            /*
             * =================================================
             * ASSEMBLE AND SHOW THE CURRENT MELODY
             * =================================================
             */

            function recomputeMelody() {

                if (!mainToolkit || slotData.length === 0) {
                    return;
                }

                const xmlList =
                    slotData.map(function (options, slotIndex) {
                        return options[selections[slotIndex]].xml;
                    });

                const combinedXML =
                    MusicEngine.combineMeasures(xmlList);

                window.originalMusicXML = combinedXML;

                MusicEngine.renderScore(
                    mainToolkit, combinedXML, "myMelody"
                );

            }


            /*
             * =================================================
             * PLAY / STOP MY MELODY
             * =================================================
             */

            document.getElementById("playButton")
                .addEventListener("click", function () {

                    if (mainToolkit) {
                        MusicEngine.playMIDI(mainToolkit);
                    }

                });

            document.getElementById("stopButton")
                .addEventListener("click", function () {
                    MusicEngine.stopMIDI();
                });


            /*
             * =================================================
             * LOAD THE MELODY-BUILDER CATALOG
             * =================================================
             */

            MusicEngine.ready(function (toolkit) {

                mainToolkit = toolkit;

                /*
                 * Color notes red as "Your Melody" plays - this
                 * only needs to be set up once; it always reflects
                 * whatever is currently loaded in mainToolkit.
                 */
                MusicEngine.attachHighlighting(toolkit);

                MusicEngine.loadCatalog("melody-builder-sets.json")
                    .then(function (sets) {

                        const selector =
                            document.getElementById("setSelector");

                        sets.forEach(function (set, index) {

                            const option =
                                document.createElement("option");

                            option.value = index;
                            option.textContent = set.title;

                            selector.appendChild(option);

                        });

                        selector.addEventListener("change", function () {
                            loadSet(sets[Number(selector.value)]);
                        });

                        if (sets.length > 0) {
                            loadSet(sets[0]);
                        }

                    })
                    .catch(function (error) {

                        console.error(error);

                        document.getElementById("slots").innerHTML =
                            "<p>Could not load the melody-builder catalog.</p>";

                    });

            });

        });

    </script>

</body>

</html>
