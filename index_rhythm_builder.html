<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notey Child — a little music reader – Build a Rhythm</title>

    <!-- Verovio -->
    <script
        src="https://www.verovio.org/javascript/5.7.0/verovio-toolkit-wasm.js"
        defer>
    </script>

    <!-- MIDI player -->
    <script src="https://www.midijs.net/lib/midi.js"></script>

    <!-- Shared engine (Verovio + MIDI logic used by every activity) -->
    <script src="music-engine.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .appTitle {
            text-align: center;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 10px 0 0 0;
        }

        .appTitle span:nth-child(1) { color: #e6194b; }
        .appTitle span:nth-child(2) { color: #f58231; }
        .appTitle span:nth-child(3) { color: #ffcc00; }
        .appTitle span:nth-child(4) { color: #3cb44b; }
        .appTitle span:nth-child(5) { color: #17a2b8; }
        .appTitle span:nth-child(6) { color: #4363d8; }
        .appTitle span:nth-child(7) { color: #911eb4; }
        .appTitle span:nth-child(8) { color: #e83e8c; }
        .appTitle span:nth-child(9) { color: #fd7e14; }
        .appTitle span:nth-child(10) { color: #20c997; }

        .appSubtitle {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #555;
            margin-bottom: 20px;
        }

        button {
            font-size: 18px;
            padding: 8px 16px;
            margin-right: 8px;
            margin-bottom: 10px;
        }

        /*
         * Make the main PLAY button stand out from the rest -
         * it's the button people reach for most.
         */
        #playButton {
            background: #2e9e44;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            padding: 12px 28px;
        }

        #playButton:hover {
            background: #257a37;
        }

        #paletteSelector {
            font-size: 24px;
            padding: 10px 16px;
            min-width: 340px;
            border: 3px solid #4a90d9;
            border-radius: 8px;
        }

        label[for="paletteSelector"] {
            font-size: 24px;
            font-weight: bold;
        }

        #instructions {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }

        h2 {
            margin-top: 35px;
        }

        #palette,
        #sequence {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
            min-height: 300px;
        }

        #sequence {
            border: 3px dashed #ccc;
            border-radius: 12px;
            padding: 15px;
        }

        .rhythmBlock {
            position: relative;

            width: 480px;
            height: 300px;

            border: 4px solid #888;
            border-radius: 12px;

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            box-sizing: border-box;

            overflow: hidden;
        }

        .rhythmBlock > svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /*
         * Palette blocks: click anywhere to add a copy.
         */
        .paletteBlock {
            cursor: pointer;
        }

        .paletteBlock:hover {
            border-color: #4a90d9;
        }

        /*
         * Sequence blocks: draggable to reorder, same touch/mouse
         * handling as the puzzle pieces.
         */
        .sequenceBlock {
            cursor: grab;
            touch-action: none;
            user-select: none;
        }

        .sequenceBlock.dragging {
            cursor: grabbing;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
            opacity: 0.9;
        }

        .playPieceButton {
            position: absolute;
            bottom: 10px;
            right: 10px;

            width: 42px;
            height: 42px;

            border-radius: 50%;
            border: none;

            background: #4a90d9;
            color: white;

            font-size: 18px;
            line-height: 42px;
            padding: 0;
            margin: 0;

            cursor: pointer;
        }

        .playPieceButton:hover {
            background: #3a7bc0;
        }

        .removeButton {
            position: absolute;
            top: 10px;
            right: 10px;

            width: 34px;
            height: 34px;

            border-radius: 50%;
            border: none;

            background: #d0392b;
            color: white;

            font-size: 18px;
            line-height: 34px;
            padding: 0;
            margin: 0;

            cursor: pointer;
        }

        .removeButton:hover {
            background: #a92d22;
        }

        #sequenceMessage {
            font-size: 22px;
            margin-top: 15px;
            min-height: 32px;
            color: #555;
        }

    </style>

</head>


<body>

    <h1 class="appTitle"><span>N</span><span>O</span><span>T</span><span>E</span><span>Y</span> <span>C</span><span>H</span><span>I</span><span>L</span><span>D</span></h1>
    <div class="appSubtitle">LITTLE MUSIC READER</div>

    <label for="paletteSelector">Palette:</label>
    <select id="paletteSelector"></select>

    <br><br>

    <p id="instructions">
        Click a block to add it to your melody, then press PLAY.
    </p>

    <button id="playButton">▶ PLAY</button>
    <button id="stopButton">■ Stop</button>
    <button id="clearButton">🗑 Clear</button>

    <h2>Blocks</h2>
    <div id="palette">Loading blocks...</div>

    <h2>Your Melody</h2>
    <div id="sequence"></div>
    <div id="sequenceMessage">
        Click a block above to start building your melody!
    </div>


    <script>

        document.addEventListener("DOMContentLoaded", function () {

            let dragState = null;


            /*
             * =================================================
             * LOAD A PALETTE
             * =================================================
             */

            function loadPalette(palette) {

                clearSequence();

                const paletteContainer =
                    document.getElementById("palette");

                paletteContainer.innerHTML = "Loading blocks...";

                const filePromises =
                    palette.patterns.map(function (pattern) {
                        return MusicEngine.loadMusicXML(pattern.file);
                    });

                Promise.all(filePromises)
                    .then(function (xmlList) {

                        /*
                         * "g.measure" - each block is exactly one
                         * measure, same as a puzzle piece.
                         */
                        const svgList =
                            MusicEngine.renderMiniMeasureSet(
                                xmlList, "g.measure"
                            );

                        paletteContainer.innerHTML = "";

                        palette.patterns.forEach(function (pattern, index) {

                            const block =
                                document.createElement("div");

                            block.className =
                                "rhythmBlock paletteBlock";

                            if (svgList[index]) {
                                block.innerHTML = svgList[index];
                            }
                            else {
                                block.textContent =
                                    pattern.label || ("Block " + (index + 1));
                            }

                            block.title = "Click to add to your melody";

                            /*
                             * Each palette block remembers its own
                             * XML and its already-rendered SVG, so
                             * adding a copy to the sequence later
                             * doesn't need to re-fetch or re-render
                             * anything.
                             */
                            block._xml = xmlList[index];
                            block._svg = svgList[index];
                            block._label = pattern.label;

                            block.addEventListener("click", function () {
                                addToSequence(block);
                            });

                            paletteContainer.appendChild(block);

                        });

                    })
                    .catch(function (error) {

                        console.error(error);

                        paletteContainer.innerHTML =
                            "<p>Could not load this palette.</p>";

                    });

            }


            /*
             * =================================================
             * SEQUENCE: ADD / REMOVE / CLEAR
             * =================================================
             */

            function addToSequence(paletteBlock) {

                const sequenceContainer =
                    document.getElementById("sequence");

                const block = document.createElement("div");

                block.className = "rhythmBlock sequenceBlock";

                if (paletteBlock._svg) {
                    block.innerHTML = paletteBlock._svg;
                }
                else {
                    block.textContent = paletteBlock._label || "Block";
                }

                /*
                 * This copy's own audio - stored directly on the
                 * element, so it travels with it even after drags
                 * reorder the DOM, and stays correct no matter how
                 * many copies of the same block exist.
                 */
                block._xml = paletteBlock._xml;

                const removeButton = document.createElement("button");

                removeButton.className = "removeButton";
                removeButton.type = "button";
                removeButton.title = "Remove this block";
                removeButton.textContent = "✕";

                removeButton.addEventListener("click", function (event) {
                    event.stopPropagation();
                    block.remove();
                    updateSequenceMessage();
                });

                block.appendChild(removeButton);

                const playButton = document.createElement("button");

                playButton.className = "playPieceButton";
                playButton.type = "button";
                playButton.title = "Play this block";
                playButton.textContent = "▶";

                playButton.addEventListener("click", function (event) {
                    event.stopPropagation();
                    MusicEngine.playMusicXML(block._xml);
                });

                block.appendChild(playButton);

                makeDraggable(block);

                sequenceContainer.appendChild(block);

                updateSequenceMessage();

            }

            function clearSequence() {

                document.getElementById("sequence").innerHTML = "";

                updateSequenceMessage();

            }

            function updateSequenceMessage() {

                const count =
                    document.getElementById("sequence").children.length;

                document.getElementById("sequenceMessage").textContent =
                    count === 0
                        ? "Click a block above to start building your melody!"
                        : "Your melody has " + count +
                            (count === 1 ? " block." : " blocks.");

            }


            /*
             * =================================================
             * DRAG TO REORDER WITHIN THE SEQUENCE (Pointer Events -
             * works consistently for mouse, touch, and pen, unlike
             * the native HTML5 drag-and-drop API on touchscreens)
             * =================================================
             */

            function makeDraggable(block) {

                block.addEventListener("pointerdown", function (event) {

                    if (event.target.closest(
                        ".playPieceButton, .removeButton"
                    )) {
                        return;
                    }

                    event.preventDefault();

                    const rect = block.getBoundingClientRect();

                    dragState = {
                        block: block,
                        grabOffsetX: event.clientX - rect.left,
                        grabOffsetY: event.clientY - rect.top
                    };

                    block.setPointerCapture(event.pointerId);

                    block.classList.add("dragging");

                });

                block.addEventListener("pointermove", function (event) {

                    if (!dragState || dragState.block !== block) {
                        return;
                    }

                    block.style.pointerEvents = "none";

                    const hoverTarget =
                        document.elementFromPoint(
                            event.clientX, event.clientY
                        );

                    block.style.pointerEvents = "";

                    const targetBlock =
                        hoverTarget
                            ? hoverTarget.closest(".sequenceBlock")
                            : null;

                    if (targetBlock && targetBlock !== block) {

                        const container =
                            document.getElementById("sequence");

                        const targetRect =
                            targetBlock.getBoundingClientRect();

                        const midpoint =
                            targetRect.left + targetRect.width / 2;

                        if (event.clientX < midpoint) {
                            container.insertBefore(block, targetBlock);
                        }
                        else {
                            container.insertBefore(
                                block, targetBlock.nextSibling
                            );
                        }

                    }

                    block.style.transform = "none";

                    const naturalRect = block.getBoundingClientRect();

                    const dx =
                        event.clientX - dragState.grabOffsetX -
                        naturalRect.left;

                    const dy =
                        event.clientY - dragState.grabOffsetY -
                        naturalRect.top;

                    block.style.transform =
                        "translate(" + dx + "px, " + dy + "px)";

                });

                function endDrag(event) {

                    if (!dragState || dragState.block !== block) {
                        return;
                    }

                    block.releasePointerCapture(event.pointerId);

                    block.classList.remove("dragging");
                    block.style.transform = "";

                    dragState = null;

                }

                block.addEventListener("pointerup", endDrag);
                block.addEventListener("pointercancel", endDrag);

            }


            /*
             * =================================================
             * PLAY / STOP / CLEAR
             * =================================================
             */

            document.getElementById("playButton")
                .addEventListener("click", function () {

                    const blocks =
                        Array.from(
                            document.getElementById("sequence").children
                        );

                    if (blocks.length === 0) {
                        return;
                    }

                    const xmlList =
                        blocks.map(function (block) {
                            return block._xml;
                        });

                    const combinedXML =
                        MusicEngine.combineMeasures(xmlList);

                    MusicEngine.playMusicXML(combinedXML);

                });

            document.getElementById("stopButton")
                .addEventListener("click", function () {
                    MusicEngine.stopMIDI();
                });

            document.getElementById("clearButton")
                .addEventListener("click", function () {
                    clearSequence();
                });


            /*
             * =================================================
             * LOAD THE PALETTE CATALOG
             * =================================================
             */

            MusicEngine.ready(function () {

                MusicEngine.loadCatalog("rhythm-palettes.json")
                    .then(function (palettes) {

                        const selector =
                            document.getElementById("paletteSelector");

                        palettes.forEach(function (palette, index) {

                            const option =
                                document.createElement("option");

                            option.value = index;
                            option.textContent = palette.title;

                            selector.appendChild(option);

                        });

                        selector.addEventListener("change", function () {
                            loadPalette(palettes[Number(selector.value)]);
                        });

                        if (palettes.length > 0) {
                            loadPalette(palettes[0]);
                        }

                    })
                    .catch(function (error) {

                        console.error(error);

                        document.getElementById("palette").innerHTML =
                            "<p>Could not load the palette catalog.</p>";

                    });

            });

        });

    </script>

</body>

</html>
